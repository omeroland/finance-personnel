# Routage et en-têtes de sécurité (fiche P1-19). Les routeurs n'ont pas de Host : le nom d'hôte
# est géré par le DNS et le certificat, pas par la règle (un seul domaine par instance).
http:
  routers:
    api:
      entryPoints: [websecure]
      rule: PathPrefix(`/api`) || Path(`/healthz`) || Path(`/readyz`)
      priority: 30
      service: api
      middlewares: [api-ratelimit, security-headers, csp]
    # P1-13-fix : seuls le realm finance (OIDC, certs, découverte, pages de connexion) et les ressources
    # statiques du login sont publics. Tout le reste de /auth (console /auth/admin, realm master,
    # API d'administration) tombe dans le routeur de refus ci-dessous (403).
    keycloak:
      entryPoints: [websecure]
      rule: Path(`/auth/realms/finance`) || PathPrefix(`/auth/realms/finance/`) || PathPrefix(`/auth/resources/`) || PathPrefix(`/auth/js/`)
      priority: 20
      service: keycloak
      middlewares: [auth-ratelimit, security-headers]
    keycloak-refus:
      entryPoints: [websecure]
      rule: PathPrefix(`/auth`)
      priority: 15
      service: keycloak
      middlewares: [refus-total]
    web:
      entryPoints: [websecure]
      rule: PathPrefix(`/`)
      priority: 1
      service: web
      middlewares: [security-headers, csp]

  services:
    api:
      loadBalancer:
        servers: [{url: "http://api:8080"}]
    web:
      loadBalancer:
        servers: [{url: "http://web:8080"}]
    keycloak:
      loadBalancer:
        servers: [{url: "http://keycloak:8080"}]

  middlewares:
    # D34 : limitation de débit par Traefik, par adresse source.
    api-ratelimit:
      rateLimit:
        average: 20
        period: 1s
        burst: 40
    # P1-13-fix : limite par adresse source sur le login (plus large que l'API : une page charge plusieurs ressources).
    auth-ratelimit:
      rateLimit:
        average: 30
        period: 1s
        burst: 60
    # Refus : liste d'adresses autorisées sans adresse joignable (RFC 5737) -> 403 ; le service n'est jamais atteint.
    refus-total:
      ipAllowList:
        sourceRange: ["192.0.2.1/32"]
    security-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        contentTypeNosniff: true
        referrerPolicy: no-referrer
        customResponseHeaders:
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"
    # style-src 'unsafe-inline' (D224) : Angular, Material et AG Grid injectent des <style> à l'exécution ; script-src reste 'self'.
    # connect-src : l'API (/api) et Keycloak (/auth) sont servis sur la même origine, donc 'self'.
    csp:
      headers:
        contentSecurityPolicy: "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

tls:
  options:
    default:
      minVersion: VersionTLS12
