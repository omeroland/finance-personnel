# Configuration statique Traefik, profil prod : Let's Encrypt (TLS-ALPN-01 sur 443).
# L'adresse de contact vient de TRAEFIK_ACME_EMAIL, passée en argument dans compose.yaml.
global:
  checkNewVersion: false
  sendAnonymousUsage: false
log:
  level: INFO
  format: json
accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
api:
  dashboard: false
ping:
  entryPoint: ping
metrics:
  prometheus:
    entryPoint: metrics
entryPoints:
  web:
    address: ":8000"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":8443"
    http:
      tls:
        certResolver: letsencrypt
  ping:
    address: ":8081"
  metrics:
    address: ":8082"
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json
      tlsChallenge: {}
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: false
