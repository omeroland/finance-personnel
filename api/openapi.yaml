    EvaluationExample:
      summary: Évaluation à l'horizon de 10 ans
      value:
        symbol: 'TSX:CNR'
        mode: corrected
        rulesVersion: '2026.1'
        computedAt: '2026-10-30T12:10:00Z'
        qualitativeGatePassed: true
        warnings:
          - Un taux ignoré, division par zéro en 2016.
        horizons:
          - horizon: 10
            indicative: false
            insufficientHistory: false
            strict: 8
            relaxed: 10
            outOf: 10
            failureCount: 2
            quality:
              strict: 6
              relaxed: 7
              outOf: 7
            price:
              strict: 2
              relaxed: 3
              outOf: 3
            verdict: watch
            criteria:
              - id: '5a'
                label: Croissance du BPA
                status: passed
                value: 0.0912
                strictThreshold: {description: '≥ 8 %', min: 0.08, minInclusive: true}
                relaxedThreshold: {description: '≥ 6 %', min: 0.06, minInclusive: true}
              - id: '5b'
                label: Hausses du BPA
                status: passed
                value: 8
                strictThreshold: {description: '≥ 4 hausses sur 10 ans', min: 4, minInclusive: true}
                relaxedThreshold: {description: '≥ 3 hausses sur 10 ans', min: 3, minInclusive: true}
              - id: '6'
                label: Croissance du dividende
                status: passed
                value: 0.0954
                strictThreshold: {description: '≥ 8 %', min: 0.08, minInclusive: true}
                relaxedThreshold: {description: '≥ 6 %', min: 0.06, minInclusive: true}
              - id: '7'
                label: Ratio de distribution
                status: borderline
                value: 0.80
                strictThreshold: {description: '0 < x ≤ 75 %', min: 0, max: 0.75, minInclusive: false, maxInclusive: true}
                relaxedThreshold: {description: '0 < x ≤ 85 %', min: 0, max: 0.85, minInclusive: false, maxInclusive: true}
              - id: '8'
                label: Dette
                status: passed
                value: 0.87
                strictThreshold: {description: '0 ≤ x ≤ 70 %', min: 0, max: 0.70, minInclusive: true, maxInclusive: true}
                relaxedThreshold: {description: '0 ≤ x ≤ 95 %', min: 0, max: 0.95, minInclusive: true, maxInclusive: true}
              - id: '9'
                label: Coupe de dividende
                status: passed
                strictThreshold: {description: Aucune baisse ni annulation}
              - id: '10'
                label: Rachats d'actions
                status: passed
                strictThreshold: {description: Actions en circulation en baisse}
              - id: '11a'
                label: P/E
                status: borderline
                value: 20.2
                strictThreshold: {description: '0 < x ≤ 25', min: 0, max: 25, minInclusive: false, maxInclusive: true}
                relaxedThreshold: {description: '0 < x ≤ 35', min: 0, max: 35, minInclusive: false, maxInclusive: true}
              - id: '11b'
                label: Rendement vs moyenne
                status: passed
                value: 0.0222
                strictThreshold: {description: Rendement actuel supérieur au rendement moyen}
              - id: '11c'
                label: P/B
                status: passed
                value: 5.48
                strictThreshold: {description: '0 < x ≤ 3', min: 0, max: 3, minInclusive: false, maxInclusive: true}
                relaxedThreshold: {description: '0 < x ≤ 6', min: 0, max: 6, minInclusive: false, maxInclusive: true}
