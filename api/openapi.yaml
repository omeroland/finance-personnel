openapi: 3.1.0
info:
  title: Finance privée — API du socle et des modules 1 et 2
  version: 1.1.0
  summary: Contrat REST du socle (comptes, registre), du module 1 (évaluation d'actions) et du module 2 (portefeuille de FNB).
  description: |
    Source unique du contrat (CLAUDE.md). Serveur Go, client Angular et serveur simulé en sont générés.

    Conventions :

    - Ratios et taux : `number` en **fraction, 0.70 = 70 %**. Jamais d'échelle 0 à 100.
    - Montants, prix et valeurs annuelles : chaîne décimale (`"152.40"`) accompagnée de sa devise, jamais un nombre à virgule flottante.
    - Dates ISO 8601 (`date` ou `date-time`).
    - Une valeur inconnue est une propriété absente, jamais `null`.
    - Erreurs au format RFC 9457 (`application/problem+json`), sans trace interne.
    - Traitements longs : réponse `202` et un `Job` à interroger.
  contact:
    name: Propriétaire de Finance privée
    url: https://github.com/omeroland/finance-personnel
  license:
    name: Propriétaire
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Même origine ; les chemins portent le préfixe /api/v1 (Traefik en production, Prism en local).
security:
  - bearerAuth: []
tags:
  - name: accounts
    description: Comptes et positions dérivées du registre.
  - name: transactions
    description: Registre de transactions en insertion seule et relevés de valeur mensuels.
  - name: portfolio
    description: Catalogue de FNB, portefeuilles modèles, plans, exposition et rendement.
  - name: stocks
    description: Liste de suivi, fiche et saisie des données d'une action.
  - name: evaluations
    description: Évaluation par le moteur de règles et archive immuable.
  - name: imports
    description: Imports de la feuille xlsx et rafraîchissements.
  - name: rules
    description: Référentiel des règles versionné.
paths:
  /api/v1/stocks:
    get:
      operationId: listStocks
      tags: [stocks]
      summary: Liste de suivi
      description: Actions suivies avec score, sous-scores et verdict pour le mode et l'horizon demandés.
      parameters:
        - $ref: '#/components/parameters/Mode'
        - $ref: '#/components/parameters/Horizon'
      responses:
        '200':
          description: Liste de suivi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockList'
              examples:
                default:
                  $ref: '#/components/examples/StockListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: addStock
      tags: [stocks]
      summary: Ajouter une action
      description: Ajoute une action à la liste de suivi. Le symbole est canonique, au format `BOURSE:SYMBOLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockCreate'
            examples:
              default:
                $ref: '#/components/examples/StockCreateExample'
      responses:
        '201':
          description: Action ajoutée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
              examples:
                default:
                  $ref: '#/components/examples/StockExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/stocks/{symbol}:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      operationId: getStock
      tags: [stocks]
      summary: Fiche d'une action
      description: Séries annuelles, instantané, qualitatif, sources et conflits entre sources.
      responses:
        '200':
          description: Fiche complète.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDetail'
              examples:
                default:
                  $ref: '#/components/examples/StockDetailExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateStock
      tags: [stocks]
      summary: Modifier les métadonnées et l'instantané
      description: Saisie manuelle. Seules les propriétés fournies sont modifiées.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockUpdate'
            examples:
              default:
                $ref: '#/components/examples/StockUpdateExample'
      responses:
        '200':
          description: Fiche mise à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDetail'
              examples:
                default:
                  $ref: '#/components/examples/StockDetailExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteStock
      tags: [stocks]
      summary: Retirer de la liste de suivi
      description: Retire l'action de la liste. L'archive des évaluations reste.
      responses:
        '204':
          description: Action retirée.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stocks/{symbol}/facts:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    put:
      operationId: replaceFacts
      tags: [stocks]
      summary: Remplacer des valeurs annuelles
      description: Saisie manuelle. Remplace les valeurs de chaque couple (année, mesure) fourni ; les autres restent intactes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactsReplace'
            examples:
              default:
                $ref: '#/components/examples/FactsReplaceExample'
      responses:
        '200':
          description: Séries annuelles après remplacement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactList'
              examples:
                default:
                  $ref: '#/components/examples/FactListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stocks/{symbol}/qualitative:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    put:
      operationId: replaceQualitative
      tags: [stocks]
      summary: Saisir le jugement qualitatif
      description: Règles 1 à 4 et rachat manuel. Remplace l'ensemble du jugement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Qualitative'
            examples:
              default:
                $ref: '#/components/examples/QualitativeExample'
      responses:
        '200':
          description: Jugement enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Qualitative'
              examples:
                default:
                  $ref: '#/components/examples/QualitativeExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stocks/{symbol}/evaluation:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      operationId: getEvaluation
      tags: [evaluations]
      summary: Évaluation à la volée
      description: Calcule l'évaluation courante sans l'archiver. Les deux profils de seuils sortent en une seule passe.
      parameters:
        - $ref: '#/components/parameters/Mode'
      responses:
        '200':
          description: Évaluation calculée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
              examples:
                default:
                  $ref: '#/components/examples/EvaluationExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stocks/{symbol}/evaluations:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      operationId: listEvaluations
      tags: [evaluations]
      summary: Historique archivé
      description: Évaluations archivées, de la plus récente à la plus ancienne.
      responses:
        '200':
          description: Historique.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRecordList'
              examples:
                default:
                  $ref: '#/components/examples/EvaluationRecordListExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createEvaluation
      tags: [evaluations]
      summary: Calculer et archiver
      description: Calcule l'évaluation et l'ajoute à l'archive immuable avec ses entrées et la version des règles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationCreate'
            examples:
              default:
                $ref: '#/components/examples/EvaluationCreateExample'
      responses:
        '201':
          description: Évaluation archivée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRecord'
              examples:
                default:
                  $ref: '#/components/examples/EvaluationRecordExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stocks/{symbol}/refresh:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    post:
      operationId: refreshStock
      tags: [imports]
      summary: Rafraîchir depuis le fournisseur de données
      description: Réponse 501 jusqu'à la phase 3 (D32). Ensuite, 202 et un job à interroger.
      responses:
        '202':
          description: Rafraîchissement accepté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                default:
                  $ref: '#/components/examples/JobExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/imports/xlsx:
    post:
      operationId: importXlsx
      tags: [imports]
      summary: Importer la feuille xlsx
      description: Import multipart (fichier de 10 Mo au plus et année de « Year 1 »). Répond 202 avec un job.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportXlsxRequest'
      responses:
        '202':
          description: Import accepté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                default:
                  $ref: '#/components/examples/JobExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/imports/{id}:
    get:
      operationId: getImport
      tags: [imports]
      summary: État d'un import
      description: État et compte rendu ligne par ligne d'un import ou d'un rafraîchissement.
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant du job.
          schema:
            type: string
            format: uuid
          example: 0b9c1f0e-6d52-4c1b-9f1d-3c8f5a2e7a10
      responses:
        '200':
          description: État du job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                default:
                  $ref: '#/components/examples/JobExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/rules:
    get:
      operationId: getRules
      tags: [rules]
      summary: Version et seuils des règles
      description: Référentiel des règles, pour les libellés des clients. Les clients n'en tirent aucun calcul.
      responses:
        '200':
          description: Référentiel des règles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rules'
              examples:
                default:
                  $ref: '#/components/examples/RulesExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: Lister les comptes
      description: Comptes de l'utilisateur (CELI, REER, CELIAPP, REEE, non enregistré), toutes devises confondues.
      responses:
        '200':
          description: Liste des comptes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
              examples:
                default:
                  $ref: '#/components/examples/AccountListExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Créer un compte
      description: Crée un compte. Un compte ne porte ni solde ni position saisis ; ils viennent du registre de transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            examples:
              default:
                $ref: '#/components/examples/AccountCreateExample'
      responses:
        '201':
          description: Compte créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                default:
                  $ref: '#/components/examples/AccountExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/accounts/{id}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: Lire le registre d'un compte
      description: Transactions du compte, de la plus ancienne à la plus récente, écritures inverses comprises.
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Registre du compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
              examples:
                default:
                  $ref: '#/components/examples/TransactionListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Ajouter une transaction
      description: |
        Le registre est en insertion seule : il n'existe ni modification ni suppression. Pour corriger une erreur,
        on ajoute l'écriture inverse en renseignant `reversesId` avec l'identifiant de la transaction annulée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
            examples:
              default:
                $ref: '#/components/examples/TransactionCreateExample'
      responses:
        '201':
          description: Transaction inscrite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                default:
                  $ref: '#/components/examples/TransactionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/accounts/{id}/statements:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: createStatement
      tags: [transactions]
      summary: Saisir un relevé de valeur mensuel
      description: Valeur de fin de mois (et cotisation du mois) d'un compte sans transactions. Un seul relevé par compte et par mois.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementCreate'
            examples:
              default:
                $ref: '#/components/examples/StatementCreateExample'
      responses:
        '201':
          description: Relevé enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
              examples:
                default:
                  $ref: '#/components/examples/StatementExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/accounts/{id}/imports/csv:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: importCsv
      tags: [imports]
      summary: Importer un relevé de courtier
      description: >-
        Import multipart d'un fichier CSV (10 Mo au plus) vers le registre du compte, avec l'adapter du courtier
        (`generic` : format de l'application). L'import est synchrone et répond 200 avec le rapport ligne par ligne,
        sans job. Une ligne invalide ou refusée est signalée sans empêcher les autres ; ré-importer le même fichier
        ne crée rien (doublons). Une ligne dont le compte n'est pas celui de la route est refusée.
      parameters:
        - $ref: '#/components/parameters/Broker'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportCsvRequest'
      responses:
        '200':
          description: Import terminé ; le rapport dit ce qui a été créé, ignoré ou refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportReport'
              examples:
                default:
                  $ref: '#/components/examples/CsvImportReportExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/accounts/{id}/positions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: listPositions
      tags: [accounts]
      summary: Positions et valeur d'un compte
      description: Positions dérivées du registre (jamais saisies), valorisées aux derniers prix connus au jour demandé.
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Positions du compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionList'
              examples:
                default:
                  $ref: '#/components/examples/PositionListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portfolio/etfs:
    get:
      operationId: listEtfs
      tags: [portfolio]
      summary: Catalogue de FNB
      description: Catalogue filtrable. Chaque profil porte la date de sa répartition et de son RFG.
      parameters:
        - name: type
          in: query
          required: false
          description: Type de FNB.
          schema:
            $ref: '#/components/schemas/EtfType'
        - name: region
          in: query
          required: false
          description: Région principale.
          schema:
            $ref: '#/components/schemas/EtfRegion'
        - name: maxMer
          in: query
          required: false
          description: RFG maximal, en fraction (0.005 = 0,5 %).
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 1
          example: 0.005
      responses:
        '200':
          description: FNB du catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtfList'
              examples:
                default:
                  $ref: '#/components/examples/EtfListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/portfolio/models:
    get:
      operationId: listModels
      tags: [portfolio]
      summary: Portefeuilles modèles
      description: Dernière version de chaque portefeuille modèle.
      responses:
        '200':
          description: Portefeuilles modèles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
              examples:
                default:
                  $ref: '#/components/examples/ModelListExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createModel
      tags: [portfolio]
      summary: Créer un portefeuille modèle
      description: Crée un modèle à la version 1. Les cibles sont validées (total de 100 %) et jamais corrigées en silence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelWrite'
            examples:
              default:
                $ref: '#/components/examples/ModelWriteExample'
      responses:
        '201':
          description: Modèle créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
              examples:
                default:
                  $ref: '#/components/examples/ModelExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/portfolio/models/{id}:
    parameters:
      - $ref: '#/components/parameters/ModelId'
    put:
      operationId: updateModel
      tags: [portfolio]
      summary: Publier une nouvelle version d'un modèle
      description: Remplace le contenu du modèle en créant la version suivante. Les versions précédentes restent lisibles par les plans qui les citent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelWrite'
            examples:
              default:
                $ref: '#/components/examples/ModelWriteExample'
      responses:
        '200':
          description: Nouvelle version du modèle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
              examples:
                default:
                  $ref: '#/components/examples/ModelExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portfolio/models/{id}/purchase-plan:
    parameters:
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: createPurchasePlan
      tags: [portfolio]
      summary: Plan d'achat initial
      description: Calcule, pour un montant donné, des ordres en parts entières ; le reste va en encaisse. Le plan est calculé, pas enregistré.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchasePlanRequest'
            examples:
              default:
                $ref: '#/components/examples/PurchasePlanRequestExample'
      responses:
        '200':
          description: Plan d'achat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
              examples:
                default:
                  $ref: '#/components/examples/PurchasePlanExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/portfolio/rebalance-plans:
    post:
      operationId: createRebalancePlan
      tags: [portfolio]
      summary: Plan de rééquilibrage
      description: |
        Pour un ou plusieurs comptes, avec ou sans nouvelle cotisation. Ordre de calcul : détecter les écarts hors bande,
        acheter avec l'encaisse et la cotisation, vendre en dernier recours (comptes enregistrés d'abord), arrondir aux
        parts entières, ignorer les ordres sous le montant minimum. Le plan est calculé, pas enregistré.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebalancePlanRequest'
            examples:
              default:
                $ref: '#/components/examples/RebalancePlanRequestExample'
      responses:
        '200':
          description: Plan de rééquilibrage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalancePlan'
              examples:
                default:
                  $ref: '#/components/examples/RebalancePlanExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/portfolio/exposure:
    get:
      operationId: getExposure
      tags: [portfolio]
      summary: Exposition par transparence
      description: Exposition réelle des positions des comptes demandés par classe d'actifs, avec le RFG pondéré, comparée au modèle s'il est fourni.
      parameters:
        - $ref: '#/components/parameters/Accounts'
        - name: modelId
          in: query
          required: false
          description: Modèle de comparaison. Sans lui, aucune cible n'est renvoyée.
          schema:
            type: string
            format: uuid
          example: 5d7a2c64-9b1e-4f3a-8c2d-7e6f1a0b3c45
      responses:
        '200':
          description: Exposition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposure'
              examples:
                default:
                  $ref: '#/components/examples/ExposureExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portfolio/performance:
    get:
      operationId: getPerformance
      tags: [portfolio]
      summary: Rendement
      description: |
        Rendement pondéré dans le temps (performance des placements) et TRI (rendement personnel), consolidé et par compte,
        par mois et par année. Un compte sans transactions utilise ses relevés de valeur mensuels.
      parameters:
        - $ref: '#/components/parameters/Accounts'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Rendement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
              examples:
                default:
                  $ref: '#/components/examples/PerformanceExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès JWT émis par Keycloak.
  parameters:
    Symbol:
      name: symbol
      in: path
      required: true
      description: Symbole canonique `BOURSE:SYMBOLE`.
      schema:
        $ref: '#/components/schemas/Symbol'
    Mode:
      name: mode
      in: query
      required: false
      description: Mode de calcul. `corrected` par défaut.
      schema:
        $ref: '#/components/schemas/Mode'
    Horizon:
      name: horizon
      in: query
      required: false
      description: Horizon en années. 10 par défaut.
      schema:
        $ref: '#/components/schemas/Horizon'
    AccountId:
      name: id
      in: path
      required: true
      description: Identifiant du compte.
      schema:
        type: string
        format: uuid
      example: 3f2a9c1e-7b4d-4e68-a1c5-2d9e8f7b6a40
    ModelId:
      name: id
      in: path
      required: true
      description: Identifiant du portefeuille modèle.
      schema:
        type: string
        format: uuid
      example: 5d7a2c64-9b1e-4f3a-8c2d-7e6f1a0b3c45
    Accounts:
      name: accounts
      in: query
      required: false
      description: Identifiants de comptes séparés par des virgules. Sans ce paramètre, tous les comptes (vue consolidée).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
        maxItems: 50
      example: [3f2a9c1e-7b4d-4e68-a1c5-2d9e8f7b6a40]
    FromDate:
      name: from
      in: query
      required: false
      description: Date de début incluse (ISO 8601).
      schema:
        type: string
        format: date
      example: '2025-01-01'
    ToDate:
      name: to
      in: query
      required: false
      description: Date de fin incluse (ISO 8601).
      schema:
        type: string
        format: date
      example: '2025-12-31'
    AsOf:
      name: asOf
      in: query
      required: false
      description: Jour de valorisation. Aujourd'hui par défaut.
      schema:
        type: string
        format: date
      example: '2025-12-31'
    Broker:
      name: broker
      in: query
      required: true
      description: Adapter de courtier. `generic` lit le format CSV générique de l'application.
      schema:
        type: string
        pattern: '^[a-z0-9_-]{1,32}$'
      example: generic
  responses:
    BadRequest:
      description: Requête invalide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/BadRequestExample'
    Unauthorized:
      description: Jeton absent ou invalide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/UnauthorizedExample'
    NotFound:
      description: Ressource introuvable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/NotFoundExample'
    Conflict:
      description: La ressource existe déjà.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ConflictExample'
    PayloadTooLarge:
      description: Corps ou fichier trop volumineux (10 Mo au plus).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/PayloadTooLargeExample'
    NotImplemented:
      description: Fonction prévue pour une phase ultérieure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/NotImplementedExample'
    Unprocessable:
      description: Requête valide mais calcul impossible (par exemple prix manquant pour un fonds du modèle).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/UnprocessableExample'
  schemas:
    Symbol:
      type: string
      description: Symbole canonique `BOURSE:SYMBOLE`, en majuscules.
      pattern: '^[A-Z]{2,10}:[A-Z0-9.\-]{1,15}$'
      example: 'TSX:CNR'
    Mode:
      type: string
      description: |
        `corrected` : mode corrigé, qui suit le référentiel consolidé.
        `compat` : reproduit la feuille d'origine, sur l'horizon de 20 ans seulement.
      enum: [corrected, compat]
      default: corrected
    Horizon:
      type: integer
      description: Horizon en années. L'horizon de 5 ans est indicatif et sans verdict.
      enum: [5, 10, 15, 20]
      default: 10
    Decimal:
      type: string
      description: Nombre décimal exact en chaîne (jamais de virgule flottante).
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      example: '152.40'
    Currency:
      type: string
      description: Code de devise ISO 4217.
      enum: [CAD, USD]
      example: CAD
    Exchange:
      type: string
      description: Bourse de cotation.
      enum: [TSX, NYSE, NASDAQ]
      example: TSX
    Metric:
      type: string
      description: |
        Mesure annuelle. `diluted_eps` : BPA dilué (montant). `dividend_per_share` : dividende par action ordinaire (montant).
        `annual_return` : rendement annuel, fraction en chaîne décimale (0.70 = 70 %). `diluted_shares` : actions en circulation diluées (nombre d'actions).
      enum: [diluted_eps, dividend_per_share, annual_return, diluted_shares]
      example: diluted_eps
    Verdict:
      type: string
      description: |
        `excluded` : une des règles 1 à 4 n'est pas à « oui ». `candidate` : 10/10 au seuil strict sur un horizon d'au moins 10 ans.
        `watch` : 10/10 seulement au seuil assoupli. `rejected` : autrement.
      enum: [excluded, candidate, watch, rejected]
      example: watch
    CriterionId:
      type: string
      description: Identifiant du critère, 5a à 11c.
      enum: ['5a', '5b', '6', '7', '8', '9', '10', '11a', '11b', '11c']
      example: '5a'
    CriterionStatus:
      type: string
      description: |
        `passed` : réussi au seuil strict. `borderline` : réussi seulement au seuil assoupli. `failed` : échoué.
        `missing` : donnée manquante (compte comme un échec en mode corrigé). `insufficient` : historique insuffisant.
        `exempt` : exempté (règle 8 pour une financière).
      enum: [passed, borderline, failed, missing, insufficient, exempt]
      example: passed
    Problem:
      type: object
      description: Erreur au format RFC 9457 (`application/problem+json`).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifiant de la famille d'erreur.
          example: 'https://finance-privee.local/problems/not-found'
        title:
          type: string
          description: Résumé court, stable d'une occurrence à l'autre.
          example: Ressource introuvable
        status:
          type: integer
          description: Code HTTP.
          example: 404
        detail:
          type: string
          description: Explication propre à cette occurrence, sans trace interne.
          example: Aucune action TSX:CNR dans la liste de suivi.
        instance:
          type: string
          format: uri-reference
          description: Chemin de la requête fautive.
          example: /api/v1/stocks/TSX:CNR
        errors:
          type: array
          description: Erreurs de validation champ par champ.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      description: Erreur de validation sur un champ.
      required: [field, message]
      properties:
        field:
          type: string
          description: Chemin du champ fautif.
          example: symbol
        message:
          type: string
          description: Description de l'erreur.
          example: Le symbole doit suivre le format BOURSE:SYMBOLE.
    Stock:
      type: object
      description: Action de la liste de suivi.
      required: [symbol, name, exchange, quoteCurrency, reportingCurrency, isFinancial, createdAt]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        name:
          type: string
          description: Nom de la compagnie.
          example: Chemin de fer Canadien National
        exchange:
          $ref: '#/components/schemas/Exchange'
        quoteCurrency:
          $ref: '#/components/schemas/Currency'
        reportingCurrency:
          $ref: '#/components/schemas/Currency'
        isFinancial:
          type: boolean
          description: Banque ou assureur. Met la règle 8 à `exempt` (D3). Faux par défaut.
          example: false
        createdAt:
          type: string
          format: date-time
          description: Date d'ajout à la liste.
          example: '2026-03-02T14:05:00Z'
    StockCreate:
      type: object
      description: Données pour ajouter une action.
      required: [symbol, name, quoteCurrency, reportingCurrency]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        name:
          type: string
          description: Nom de la compagnie.
          minLength: 1
          maxLength: 200
          example: Chemin de fer Canadien National
        quoteCurrency:
          $ref: '#/components/schemas/Currency'
        reportingCurrency:
          $ref: '#/components/schemas/Currency'
        isFinancial:
          type: boolean
          description: Banque ou assureur. Faux par défaut.
          default: false
    StockUpdate:
      type: object
      description: Métadonnées et instantané à modifier. Toute propriété absente reste inchangée.
      minProperties: 1
      properties:
        name:
          type: string
          description: Nom de la compagnie.
          minLength: 1
          maxLength: 200
        quoteCurrency:
          $ref: '#/components/schemas/Currency'
        reportingCurrency:
          $ref: '#/components/schemas/Currency'
        isFinancial:
          type: boolean
          description: Banque ou assureur.
        snapshot:
          $ref: '#/components/schemas/Snapshot'
    Snapshot:
      type: object
      description: Valeurs courantes de l'action. Chaque montant est dans la devise indiquée.
      required: [currency]
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        price:
          $ref: '#/components/schemas/Decimal'
        annualDividend:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Dividende annuel prévu par action.
        longTermDebt:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Dette à long terme.
        equity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Capitaux propres.
        bookValuePerShare:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Valeur comptable par action.
        fxRate:
          type: number
          description: Taux de change de la devise de déclaration vers la devise de cotation (1.0 = parité).
          minimum: 0
          example: 1.0
        asOf:
          type: string
          format: date
          description: Date des valeurs.
          example: '2026-10-30'
        source:
          type: string
          description: Origine des valeurs (`manual`, `xlsx`, nom du fournisseur).
          example: manual
    AnnualFact:
      type: object
      description: Valeur annuelle d'une mesure pour une année fiscale.
      required: [fiscalYear, metric, value, currency, source]
      properties:
        fiscalYear:
          type: integer
          description: Année fiscale.
          minimum: 1980
          maximum: 2100
          example: 2025
        metric:
          $ref: '#/components/schemas/Metric'
        value:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Valeur exacte. Pour `annual_return`, fraction (0.70 = 70 %).
        currency:
          $ref: '#/components/schemas/Currency'
        source:
          type: string
          description: Origine de la valeur (`manual`, `xlsx`, nom du fournisseur).
          example: manual
        fetchedAt:
          type: string
          format: date-time
          description: Moment de saisie ou de récupération.
          example: '2026-10-30T12:00:00Z'
    FactsReplace:
      type: object
      description: Valeurs annuelles à remplacer.
      required: [facts]
      properties:
        facts:
          type: array
          description: Valeurs à écrire, au plus une par couple (année, mesure).
          minItems: 1
          maxItems: 400
          items:
            $ref: '#/components/schemas/AnnualFact'
    FactList:
      type: object
      description: Séries annuelles d'une action.
      required: [facts]
      properties:
        facts:
          type: array
          description: Valeurs triées par mesure puis par année.
          items:
            $ref: '#/components/schemas/AnnualFact'
    Answer:
      type: string
      description: Réponse à une règle qualitative.
      enum: ['yes', 'no', unanswered]
      example: 'yes'
    RuleAnswer:
      type: object
      description: Réponse et note pour une règle qualitative.
      required: [answer]
      properties:
        answer:
          $ref: '#/components/schemas/Answer'
        note:
          type: string
          description: Note libre.
          maxLength: 2000
          example: Franchise ferroviaire difficile à reproduire.
    Qualitative:
      type: object
      description: Jugement du propriétaire. Les quatre règles doivent être à `yes` pour éviter l'exclusion.
      required: [rule1, rule2, rule3, rule4]
      properties:
        rule1:
          $ref: '#/components/schemas/RuleAnswer'
        rule2:
          $ref: '#/components/schemas/RuleAnswer'
        rule3:
          $ref: '#/components/schemas/RuleAnswer'
        rule4:
          $ref: '#/components/schemas/RuleAnswer'
        manualBuyback:
          type: boolean
          description: Rachat d'actions saisi à la main pour la règle 10 (oui ou non). Absent si non saisi.
          example: true
        reviewedAt:
          type: string
          format: date-time
          description: Dernière révision, fixée par le serveur.
          readOnly: true
          example: '2026-10-30T12:05:00Z'
    SourceSummary:
      type: object
      description: Résumé des valeurs venant d'une source.
      required: [source, factCount]
      properties:
        source:
          type: string
          description: Nom de la source.
          example: xlsx
        factCount:
          type: integer
          description: Nombre de valeurs annuelles provenant de cette source.
          minimum: 0
          example: 80
        lastFetchedAt:
          type: string
          format: date-time
          description: Dernière récupération.
          example: '2026-10-30T12:00:00Z'
    SourceValue:
      type: object
      description: Valeur proposée par une source.
      required: [source, value]
      properties:
        source:
          type: string
          description: Nom de la source.
          example: xlsx
        value:
          $ref: '#/components/schemas/Decimal'
    SourceConflict:
      type: object
      description: Deux sources donnent des valeurs différentes pour la même mesure et la même année.
      required: [fiscalYear, metric, values]
      properties:
        fiscalYear:
          type: integer
          description: Année fiscale.
          example: 2024
        metric:
          $ref: '#/components/schemas/Metric'
        values:
          type: array
          description: Valeurs en désaccord, une par source.
          minItems: 2
          items:
            $ref: '#/components/schemas/SourceValue'
    StockDetail:
      type: object
      description: Fiche complète d'une action.
      required: [stock, facts, qualitative, sources, conflicts]
      properties:
        stock:
          $ref: '#/components/schemas/Stock'
        facts:
          type: array
          description: Séries annuelles.
          items:
            $ref: '#/components/schemas/AnnualFact'
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        qualitative:
          $ref: '#/components/schemas/Qualitative'
        sources:
          type: array
          description: Sources des valeurs.
          items:
            $ref: '#/components/schemas/SourceSummary'
        conflicts:
          type: array
          description: Conflits entre sources, à trancher à la main.
          items:
            $ref: '#/components/schemas/SourceConflict'
    SubScore:
      type: object
      description: Sous-score (qualité sur 7, prix sur 3), aux deux profils de seuils.
      required: [strict, relaxed, outOf]
      properties:
        strict:
          type: integer
          description: Critères réussis au seuil strict.
          minimum: 0
          example: 6
        relaxed:
          type: integer
          description: Critères réussis au seuil assoupli (inclut les réussis au strict).
          minimum: 0
          example: 7
        outOf:
          type: integer
          description: Total possible (moins un par critère exempté).
          minimum: 0
          example: 7
    ScoreSummary:
      type: object
      description: Score d'un horizon, tel qu'affiché dans la liste de suivi.
      required: [horizon, mode, strict, relaxed, outOf, failureCount, quality, price]
      properties:
        horizon:
          $ref: '#/components/schemas/Horizon'
        mode:
          $ref: '#/components/schemas/Mode'
        strict:
          type: integer
          description: Score au seuil strict.
          minimum: 0
          example: 8
        relaxed:
          type: integer
          description: Score au seuil assoupli.
          minimum: 0
          example: 10
        outOf:
          type: integer
          description: Total possible, 10 (9 si un critère est exempté).
          minimum: 0
          example: 10
        failureCount:
          type: integer
          description: Compte d'échecs de la feuille (0 = parfait).
          minimum: 0
          example: 2
        quality:
          $ref: '#/components/schemas/SubScore'
        price:
          $ref: '#/components/schemas/SubScore'
        verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          description: Absent pour l'horizon de 5 ans, indicatif seulement (D9).
        insufficientHistory:
          type: boolean
          description: Vrai si l'horizon manque de données (jamais extrapolé).
          example: false
        perfectHorizon:
          allOf:
            - $ref: '#/components/schemas/Horizon'
          description: >-
            Plus long horizon (5, 10, 15 ou 20 ans) auquel l'action atteint 10/10 au seuil strict.
            Calculé par le serveur ; absent si aucun horizon n'atteint 10/10 (D37). Évite au client
            d'interroger les quatre horizons.
    StockSummary:
      type: object
      description: Une ligne de la liste de suivi.
      required: [stock, score]
      properties:
        stock:
          $ref: '#/components/schemas/Stock'
        score:
          $ref: '#/components/schemas/ScoreSummary'
    StockList:
      type: object
      description: Liste de suivi.
      required: [items]
      properties:
        items:
          type: array
          description: Actions suivies, triées par symbole.
          items:
            $ref: '#/components/schemas/StockSummary'
    Threshold:
      type: object
      description: |
        Seuil d'un critère. Les bornes sont des nombres : fraction pour un ratio (0.75 = 75 %), nombre pour un compte ou un multiple (P/E).
        Une borne absente n'existe pas ; `description` porte les critères sans borne numérique.
      required: [description]
      properties:
        description:
          type: string
          description: Texte lisible du seuil, pour l'affichage.
          example: 0 < x ≤ 75 %
        min:
          type: number
          description: Borne basse.
          example: 0
        max:
          type: number
          description: Borne haute (fraction, 0.75 = 75 %).
          example: 0.75
        minInclusive:
          type: boolean
          description: La borne basse est incluse.
          example: false
        maxInclusive:
          type: boolean
          description: La borne haute est incluse.
          example: true
    Criterion:
      type: object
      description: Résultat d'un critère, avec ses deux seuils côte à côte. Le seuil assoupli ne remplace jamais le strict.
      required: [id, status, strictThreshold]
      properties:
        id:
          $ref: '#/components/schemas/CriterionId'
        label:
          type: string
          description: Libellé du critère.
          example: Croissance du BPA
        status:
          $ref: '#/components/schemas/CriterionStatus'
        value:
          type: number
          format: double
          description: Valeur mesurée. Fraction pour un ratio ou une croissance (fraction, 0.70 = 70 %), nombre pour un compte ou un multiple. Absente si manquante.
          example: 0.0912
        strictThreshold:
          $ref: '#/components/schemas/Threshold'
        relaxedThreshold:
          allOf:
            - $ref: '#/components/schemas/Threshold'
          description: Absent si le critère n'a pas de seuil assoupli.
        note:
          type: string
          description: Précision (donnée manquante, taux ignoré, exemption).
          example: Un taux ignoré, division par zéro en 2016.
    HorizonResult:
      type: object
      description: Résultat de l'évaluation pour un horizon.
      required: [horizon, indicative, insufficientHistory, strict, relaxed, outOf, failureCount, quality, price, criteria]
      properties:
        horizon:
          $ref: '#/components/schemas/Horizon'
        indicative:
          type: boolean
          description: Vrai pour l'horizon de 5 ans, affiché sans verdict (D9).
          example: false
        insufficientHistory:
          type: boolean
          description: Vrai si l'horizon manque de données.
          example: false
        strict:
          type: integer
          description: Score au seuil strict.
          minimum: 0
          example: 8
        relaxed:
          type: integer
          description: Score au seuil assoupli.
          minimum: 0
          example: 10
        outOf:
          type: integer
          description: Total possible, 10 (9 si un critère est exempté).
          minimum: 0
          example: 10
        failureCount:
          type: integer
          description: Compte d'échecs de la feuille (0 = parfait).
          minimum: 0
          example: 2
        quality:
          $ref: '#/components/schemas/SubScore'
        price:
          $ref: '#/components/schemas/SubScore'
        verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          description: Absent pour l'horizon indicatif.
        criteria:
          type: array
          description: Les 10 critères, de 5a à 11c.
          items:
            $ref: '#/components/schemas/Criterion'
    Evaluation:
      type: object
      description: Évaluation d'une action, aux deux profils de seuils.
      required: [symbol, mode, rulesVersion, computedAt, qualitativeGatePassed, horizons]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        mode:
          $ref: '#/components/schemas/Mode'
        rulesVersion:
          type: string
          description: Version des règles utilisée (règle 12).
          example: '2026.1'
        computedAt:
          type: string
          format: date-time
          description: Moment du calcul.
          example: '2026-10-30T12:10:00Z'
        qualitativeGatePassed:
          type: boolean
          description: Vrai si les règles 1 à 4 sont toutes à `yes`. Sinon le verdict est `excluded`.
          example: true
        warnings:
          type: array
          description: Avertissements du calcul (taux ignoré, unité convertie, conflit de sources).
          items:
            type: string
        horizons:
          type: array
          description: Un résultat par horizon.
          minItems: 1
          items:
            $ref: '#/components/schemas/HorizonResult'
    EvaluationCreate:
      type: object
      description: Paramètres du calcul à archiver.
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
    EvaluationRecord:
      type: object
      description: Évaluation archivée, immuable, avec de quoi la recalculer à l'identique.
      required: [id, createdAt, mode, rulesVersion, inputsFingerprint, evaluation]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'archive.
          example: 5d0e8f46-2a3b-4f0c-8a55-6c1d9d3b7e21
        createdAt:
          type: string
          format: date-time
          description: Moment de l'archivage.
          example: '2026-10-30T12:10:00Z'
        mode:
          $ref: '#/components/schemas/Mode'
        rulesVersion:
          type: string
          description: Version des règles archivée.
          example: '2026.1'
        inputsFingerprint:
          type: string
          description: Empreinte SHA-256 des entrées archivées, en hexadécimal.
          pattern: '^[0-9a-f]{64}$'
          example: 3b7c1e9d5a2f48b6c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3
        evaluation:
          $ref: '#/components/schemas/Evaluation'
    EvaluationRecordList:
      type: object
      description: Historique archivé.
      required: [items]
      properties:
        items:
          type: array
          description: Archives, de la plus récente à la plus ancienne.
          items:
            $ref: '#/components/schemas/EvaluationRecord'
    JobStatus:
      type: string
      description: État d'un job.
      enum: [queued, running, succeeded, failed]
      example: succeeded
    JobEntry:
      type: object
      description: Ligne du compte rendu d'un import.
      required: [level, message]
      properties:
        level:
          type: string
          description: Gravité.
          enum: [info, warning, error]
          example: warning
        kind:
          type: string
          description: >-
            Catégorie de l'entrée, en plus du niveau. imported : ligne importée ; skipped : ligne
            ignorée ; conflict : valeur en conflit avec une donnée existante, non écrasée ;
            normalized : valeur corrigée à la lecture (ex. pourcentage divisé par 100) ;
            protected : instantané existant protégé, non remplacé. Absent pour les entrées sans
            catégorie.
          enum: [imported, skipped, conflict, normalized, protected]
          example: normalized
        line:
          type: integer
          description: Ligne ou rangée de la feuille.
          minimum: 1
          example: 14
        symbol:
          type: string
          description: Symbole concerné, si connu.
          example: 'TSX:CNR'
        message:
          type: string
          description: Description.
          example: Dette sur capitaux propres lue comme un pourcentage, divisée par 100.
    Job:
      type: object
      description: Traitement long (import ou rafraîchissement).
      required: [id, type, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant du job.
          example: 0b9c1f0e-6d52-4c1b-9f1d-3c8f5a2e7a10
        type:
          type: string
          description: Nature du job.
          enum: [xlsx, provider]
          example: xlsx
        status:
          $ref: '#/components/schemas/JobStatus'
        createdAt:
          type: string
          format: date-time
          description: Création du job.
          example: '2026-10-30T12:00:00Z'
        finishedAt:
          type: string
          format: date-time
          description: Fin du job. Absent tant qu'il n'est pas terminé.
          example: '2026-10-30T12:00:04Z'
        stocksImported:
          type: integer
          description: Nombre d'actions importées.
          minimum: 0
          example: 12
        entries:
          type: array
          description: Compte rendu ligne par ligne.
          items:
            $ref: '#/components/schemas/JobEntry'
    ImportXlsxRequest:
      type: object
      description: Import de la feuille xlsx.
      required: [file, year1]
      properties:
        file:
          type: string
          format: binary
          description: Fichier xlsx, 10 Mo au plus.
        year1:
          type: integer
          description: Année fiscale de la colonne « Year 1 » de la feuille.
          minimum: 1980
          maximum: 2100
          example: 2006
    RuleDefinition:
      type: object
      description: Définition d'un critère et de ses seuils.
      required: [id, label, formula, period, strict]
      properties:
        id:
          $ref: '#/components/schemas/CriterionId'
        label:
          type: string
          description: Libellé du critère.
          example: Ratio de distribution
        formula:
          type: string
          description: Formule en mots.
          example: Dividende annuel par action / BPA
        period:
          type: string
          description: Période observée.
          example: Dernier exercice
        strict:
          $ref: '#/components/schemas/Threshold'
        relaxed:
          allOf:
            - $ref: '#/components/schemas/Threshold'
          description: Absent si le critère n'a pas de seuil assoupli.
        byHorizon:
          type: array
          description: Seuils par horizon, pour la règle 5b seulement.
          items:
            $ref: '#/components/schemas/HorizonThreshold'
    HorizonThreshold:
      type: object
      description: Seuils d'un critère pour un horizon donné.
      required: [horizon, strict]
      properties:
        horizon:
          $ref: '#/components/schemas/Horizon'
        strict:
          $ref: '#/components/schemas/Threshold'
        relaxed:
          $ref: '#/components/schemas/Threshold'
    Rules:
      type: object
      description: Référentiel des règles versionné (règle 12).
      required: [version, criteria]
      properties:
        version:
          type: string
          description: Version du fichier de règles.
          example: '2026.1'
        criteria:
          type: array
          description: Les 10 critères de 5a à 11c.
          items:
            $ref: '#/components/schemas/RuleDefinition'
    AccountType:
      type: string
      description: Type de compte ; `taxable` désigne un compte non enregistré.
      enum: [celi, reer, celiapp, reee, taxable]
      example: celi
    Account:
      type: object
      description: Compte de placement. Il ne porte aucun solde ; la valeur vient du registre et des prix.
      required: [id, name, type, broker, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant du compte.
          example: 3f2a9c1e-7b4d-4e68-a1c5-2d9e8f7b6a40
        name:
          type: string
          description: Nom affiché.
          minLength: 1
          maxLength: 100
          example: CELI Questrade
        type:
          $ref: '#/components/schemas/AccountType'
        broker:
          type: string
          description: Nom du courtier.
          minLength: 1
          maxLength: 100
          example: Questrade
        currency:
          $ref: '#/components/schemas/Currency'
        createdAt:
          type: string
          format: date-time
          description: Création du compte.
          example: '2025-01-15T14:30:00Z'
    AccountCreate:
      type: object
      description: Création d'un compte.
      required: [name, type, broker, currency]
      properties:
        name:
          type: string
          description: Nom affiché.
          minLength: 1
          maxLength: 100
          example: CELI Questrade
        type:
          $ref: '#/components/schemas/AccountType'
        broker:
          type: string
          description: Nom du courtier.
          minLength: 1
          maxLength: 100
          example: Questrade
        currency:
          $ref: '#/components/schemas/Currency'
    AccountList:
      type: object
      description: Liste de comptes.
      required: [items]
      properties:
        items:
          type: array
          description: Comptes.
          items:
            $ref: '#/components/schemas/Account'
    TransactionType:
      type: string
      description: |
        `buy` achat, `sell` vente, `dividend` dividende ou distribution en espèces, `drip` distribution réinvestie,
        `contribution` cotisation, `withdrawal` retrait, `fee` frais, `transfer` transfert entre comptes, `split` fractionnement.
      enum: [buy, sell, dividend, drip, contribution, withdrawal, fee, transfer, split]
      example: buy
    Transaction:
      type: object
      description: Écriture du registre, en insertion seule. Les montants sont dans la devise de la transaction.
      required: [id, accountId, type, tradeDate, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de la transaction.
          example: 8c1d4e2f-6a3b-4c7d-9e0f-1a2b3c4d5e6f
        accountId:
          type: string
          format: uuid
          description: Compte du registre.
          example: 3f2a9c1e-7b4d-4e68-a1c5-2d9e8f7b6a40
        type:
          $ref: '#/components/schemas/TransactionType'
        tradeDate:
          type: string
          format: date
          description: Date d'exécution.
          example: '2025-03-14'
        symbol:
          allOf:
            - $ref: '#/components/schemas/Symbol'
          description: Instrument concerné (achat, vente, dividende, distribution réinvestie, fractionnement, transfert de titres).
        quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Nombre de parts, positif (peut être fractionnaire pour une distribution réinvestie).
        price:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Prix par part.
        amount:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Montant brut de l'opération, positif ; le type donne le sens.
        fee:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Frais de l'opération, positifs.
        splitRatio:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Pour un fractionnement, nombre de parts nouvelles pour une ancienne (`2` pour 2 contre 1).
        counterpartAccountId:
          type: string
          format: uuid
          description: Pour un transfert, l'autre compte.
          example: 7a6b5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c5d
        currency:
          $ref: '#/components/schemas/Currency'
        reversesId:
          type: string
          format: uuid
          description: Présent si cette écriture est l'écriture inverse de la transaction désignée.
          example: 9d8c7b6a-5f4e-4d3c-a2b1-0f9e8d7c6b5a
        note:
          type: string
          description: Note libre.
          maxLength: 500
          example: Achat mensuel
        createdAt:
          type: string
          format: date-time
          description: Inscription au registre.
          example: '2025-03-14T15:02:11Z'
    TransactionCreate:
      type: object
      description: |
        Nouvelle transaction. Champs requis selon le type : `buy` et `sell` demandent symbol, quantity et price ;
        `dividend` demande symbol et amount ; `drip` demande symbol, quantity et price ; `contribution`, `withdrawal` et `fee`
        demandent amount ; `transfer` demande counterpartAccountId et amount (ou symbol et quantity) ; `split` demande symbol et splitRatio.
        Une violation répond 400.
      required: [type, tradeDate, currency]
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        tradeDate:
          type: string
          format: date
          description: Date d'exécution.
          example: '2025-03-14'
        symbol:
          $ref: '#/components/schemas/Symbol'
        quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Nombre de parts, positif.
        price:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Prix par part.
        amount:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Montant brut, positif.
        fee:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Frais, positifs.
        splitRatio:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Parts nouvelles pour une ancienne.
        counterpartAccountId:
          type: string
          format: uuid
          description: Autre compte d'un transfert.
          example: 7a6b5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c5d
        currency:
          $ref: '#/components/schemas/Currency'
        reversesId:
          type: string
          format: uuid
          description: Transaction annulée par cette écriture inverse. Les autres champs reprennent ceux de l'original.
          example: 9d8c7b6a-5f4e-4d3c-a2b1-0f9e8d7c6b5a
        note:
          type: string
          description: Note libre.
          maxLength: 500
          example: Achat mensuel
    TransactionList:
      type: object
      description: Registre d'un compte.
      required: [items]
      properties:
        items:
          type: array
          description: Transactions, de la plus ancienne à la plus récente.
          items:
            $ref: '#/components/schemas/Transaction'
    YearMonth:
      type: string
      description: Mois au format `AAAA-MM`.
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      example: 2025-03
    Statement:
      type: object
      description: Relevé de valeur de fin de mois d'un compte sans transactions.
      required: [id, accountId, month, endValue, currency]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant du relevé.
          example: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
        accountId:
          type: string
          format: uuid
          description: Compte du relevé.
          example: 3f2a9c1e-7b4d-4e68-a1c5-2d9e8f7b6a40
        month:
          $ref: '#/components/schemas/YearMonth'
        endValue:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Valeur du compte à la fin du mois.
        contribution:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Cotisation nette du mois (négative pour un retrait). Absente si aucune.
        currency:
          $ref: '#/components/schemas/Currency'
    StatementCreate:
      type: object
      description: Saisie d'un relevé mensuel.
      required: [month, endValue, currency]
      properties:
        month:
          $ref: '#/components/schemas/YearMonth'
        endValue:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Valeur du compte à la fin du mois.
        contribution:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Cotisation nette du mois (négative pour un retrait).
        currency:
          $ref: '#/components/schemas/Currency'
    ImportCsvRequest:
      type: object
      description: Import d'un relevé CSV de courtier.
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Fichier CSV, 10 Mo au plus.
    CsvImportEntry:
      type: object
      description: Un problème ou un fait notable relevé à une ligne du fichier.
      required: [line, level, message]
      properties:
        line:
          type: integer
          description: Numéro de ligne dans le fichier (les en-têtes sont la ligne 1).
          minimum: 1
          example: 4
        level:
          type: string
          description: Gravité (`info`, `warning` ou `error`).
          example: error
        kind:
          type: string
          description: Catégorie (`invalid`, `duplicate`, `rejected`…).
          example: invalid
        column:
          type: string
          description: Colonne en cause, si elle est connue.
          example: quantité
        message:
          type: string
          description: Explication destinée à l'utilisateur.
          example: Quantité absente.
    CsvImportReport:
      type: object
      description: Rapport d'un import CSV synchrone.
      required: [rowsRead, valid, invalid, created, duplicates, rejected, warnings, entries]
      properties:
        rowsRead:
          type: integer
          description: Lignes de données lues.
          minimum: 0
          example: 9
        valid:
          type: integer
          description: Lignes valides.
          minimum: 0
          example: 8
        invalid:
          type: integer
          description: Lignes invalides, sautées.
          minimum: 0
          example: 1
        created:
          type: integer
          description: Écritures ajoutées au registre.
          minimum: 0
          example: 8
        duplicates:
          type: integer
          description: Lignes déjà au registre, ignorées.
          minimum: 0
          example: 0
        rejected:
          type: integer
          description: Lignes refusées (compte inconnu ou autre que celui de la route, devise du compte).
          minimum: 0
          example: 0
        warnings:
          type: integer
          description: Avertissements.
          minimum: 0
          example: 0
        entries:
          type: array
          description: Une entrée par problème, avec numéro de ligne, niveau, colonne et message.
          items:
            $ref: '#/components/schemas/CsvImportEntry'
    Position:
      type: object
      description: Position dérivée du registre. Le prix et la valeur sont absents si aucun prix n'est connu.
      required: [symbol, quantity, currency]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        name:
          type: string
          description: Nom de l'instrument.
          example: iShares Core Equity ETF Portfolio
        quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Nombre de parts détenues.
        averageCost:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Coût moyen par part.
        price:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Dernier prix connu au jour demandé.
        priceDate:
          type: string
          format: date
          description: Date du prix.
          example: '2025-12-31'
        marketValue:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Valeur de marché.
        currency:
          $ref: '#/components/schemas/Currency'
    PositionList:
      type: object
      description: Positions d'un compte au jour demandé.
      required: [accountId, asOf, currency, cash, positions]
      properties:
        accountId:
          type: string
          format: uuid
          description: Compte.
          example: 3f2a9c1e-7b4d-4e68-a1c5-2d9e8f7b6a40
        asOf:
          type: string
          format: date
          description: Jour de valorisation.
          example: '2025-12-31'
        currency:
          $ref: '#/components/schemas/Currency'
        cash:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Encaisse du compte, dérivée du registre.
        totalValue:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Encaisse plus valeur de marché. Absente si une position n'a pas de prix.
        positions:
          type: array
          description: Positions ouvertes.
          items:
            $ref: '#/components/schemas/Position'
    AssetClass:
      type: string
      description: |
        Les six classes d'actifs. `equity_ca` actions canadiennes, `equity_us` actions américaines, `equity_intl` actions internationales,
        `bond_ca` obligations canadiennes, `bond_other` autres obligations, `other_assets` autres actifs (immobilier, or, crypto).
      enum: [equity_ca, equity_us, equity_intl, bond_ca, bond_other, other_assets]
      example: equity_ca
    EtfType:
      type: string
      description: Type de FNB.
      enum: [equity, fixed_income, balanced, other]
      example: equity
    EtfRegion:
      type: string
      description: Région principale du FNB.
      enum: [ca, us, intl, global]
      example: global
    AssetAllocation:
      type: object
      description: Part d'une classe d'actifs dans un fonds.
      required: [assetClass, weight]
      properties:
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        weight:
          type: number
          format: double
          description: Part de la classe, en fraction (0.30 = 30 %).
          minimum: 0
          maximum: 1
          example: 0.3
    EtfReturn:
      type: object
      description: Rendement annualisé d'un FNB sur un nombre d'années.
      required: [years, annualized]
      properties:
        years:
          type: integer
          description: Nombre d'années, de 1 à 10.
          minimum: 1
          maximum: 10
          example: 5
        annualized:
          type: number
          format: double
          description: Rendement annualisé, en fraction (0.07 = 7 %).
          example: 0.071
    Etf:
      type: object
      description: Profil d'un FNB du catalogue. Une valeur inconnue est une propriété absente.
      required: [symbol, name, type, currency, allocation, asOf]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        name:
          type: string
          description: Nom du fonds.
          example: iShares Core Equity ETF Portfolio
        type:
          $ref: '#/components/schemas/EtfType'
        region:
          $ref: '#/components/schemas/EtfRegion'
        currency:
          $ref: '#/components/schemas/Currency'
        allocation:
          type: array
          description: Répartition par classe d'actifs. Les parts totalisent 1, six classes au plus.
          maxItems: 6
          items:
            $ref: '#/components/schemas/AssetAllocation'
        mer:
          type: number
          format: double
          description: Ratio de frais de gestion (RFG), en fraction (0.002 = 0,20 %).
          minimum: 0
          maximum: 1
          example: 0.002
        size:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Actif net du fonds, dans la devise du fonds.
        esg:
          type: boolean
          description: Vrai si le fonds suit une stratégie ESG.
          example: false
        returns:
          type: array
          description: Rendements annualisés de 1 à 10 ans.
          items:
            $ref: '#/components/schemas/EtfReturn'
        asOf:
          type: string
          format: date
          description: Date de la répartition et du RFG.
          example: '2025-10-31'
    EtfList:
      type: object
      description: FNB du catalogue.
      required: [items]
      properties:
        items:
          type: array
          description: FNB correspondant aux filtres.
          items:
            $ref: '#/components/schemas/Etf'
    ClassTarget:
      type: object
      description: Cible d'une classe d'actifs.
      required: [assetClass, target]
      properties:
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        target:
          type: number
          format: double
          description: Cible, en fraction (0.275 = 27,5 %).
          minimum: 0
          maximum: 1
          example: 0.275
    ModelHolding:
      type: object
      description: Fonds retenu dans un modèle.
      required: [symbol, weight]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        weight:
          type: number
          format: double
          description: Poids du fonds dans le portefeuille, en fraction (0.35 = 35 %).
          minimum: 0
          maximum: 1
          example: 0.35
    Bands:
      type: object
      description: Bandes de rééquilibrage.
      properties:
        relative:
          type: number
          format: double
          description: Bande relative d'un fonds autour de sa cible, en fraction (0.20 = ±20 % de la cible). 0.20 par défaut.
          minimum: 0
          maximum: 1
          example: 0.2
        cashPoints:
          type: number
          format: double
          description: Écart absolu toléré au-dessus de la cible d'encaisse, en fraction du portefeuille (0.05 = 5 points). 0.05 par défaut.
          minimum: 0
          maximum: 1
          example: 0.05
    ModelWrite:
      type: object
      description: |
        Contenu d'un modèle. Les cibles par classe et la cible d'encaisse totalisent 1 (tolérance 1e-6) ;
        les poids des fonds et la cible d'encaisse totalisent aussi 1. Vingt fonds au plus.
      required: [name, targets, holdings]
      properties:
        name:
          type: string
          description: Nom du modèle.
          minLength: 1
          maxLength: 100
          example: Croissance 80/20
        targets:
          type: array
          description: Une cible par classe d'actifs.
          maxItems: 6
          items:
            $ref: '#/components/schemas/ClassTarget'
        cashTarget:
          type: number
          format: double
          description: Cible d'encaisse, en fraction. Si absente, aucune encaisse cible.
          minimum: 0
          maximum: 1
          example: 0
        holdings:
          type: array
          description: Fonds retenus.
          maxItems: 20
          items:
            $ref: '#/components/schemas/ModelHolding'
        bands:
          $ref: '#/components/schemas/Bands'
    Model:
      type: object
      description: Portefeuille modèle, dans une version donnée.
      required: [id, name, version, targets, holdings, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant du modèle, stable d'une version à l'autre.
          example: 5d7a2c64-9b1e-4f3a-8c2d-7e6f1a0b3c45
        name:
          type: string
          description: Nom du modèle.
          example: Croissance 80/20
        version:
          type: integer
          description: Numéro de version, à partir de 1.
          minimum: 1
          example: 1
        targets:
          type: array
          description: Une cible par classe d'actifs.
          items:
            $ref: '#/components/schemas/ClassTarget'
        cashTarget:
          type: number
          format: double
          description: Cible d'encaisse, en fraction.
          example: 0
        holdings:
          type: array
          description: Fonds retenus.
          items:
            $ref: '#/components/schemas/ModelHolding'
        bands:
          $ref: '#/components/schemas/Bands'
        createdAt:
          type: string
          format: date-time
          description: Création de cette version.
          example: '2025-11-01T12:00:00Z'
    ModelList:
      type: object
      description: Portefeuilles modèles.
      required: [items]
      properties:
        items:
          type: array
          description: Dernière version de chaque modèle.
          items:
            $ref: '#/components/schemas/Model'
    PurchasePlanRequest:
      type: object
      description: Montant à investir.
      required: [amount, currency]
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Montant à investir, positif.
        currency:
          $ref: '#/components/schemas/Currency'
    OrderSide:
      type: string
      description: Sens de l'ordre.
      enum: [buy, sell]
      example: buy
    PlanOrder:
      type: object
      description: Ordre prêt à saisir chez le courtier, en parts entières.
      required: [side, symbol, shares, price, amount]
      properties:
        side:
          $ref: '#/components/schemas/OrderSide'
        symbol:
          $ref: '#/components/schemas/Symbol'
        accountId:
          type: string
          format: uuid
          description: Compte visé (plan de rééquilibrage seulement).
          example: 3f2a9c1e-7b4d-4e68-a1c5-2d9e8f7b6a40
        shares:
          type: integer
          description: Nombre de parts entières, au moins 1.
          minimum: 1
          example: 120
        price:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Prix utilisé pour le calcul.
        amount:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Montant de l'ordre, parts fois prix.
    PurchasePlan:
      type: object
      description: Plan d'achat initial. Le reste non investi va en encaisse.
      required: [modelId, modelVersion, currency, amount, invested, cashRemainder, orders]
      properties:
        modelId:
          type: string
          format: uuid
          description: Modèle utilisé.
          example: 5d7a2c64-9b1e-4f3a-8c2d-7e6f1a0b3c45
        modelVersion:
          type: integer
          description: Version du modèle utilisée.
          example: 1
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Montant demandé.
        invested:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Somme des ordres.
        cashRemainder:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Reste en encaisse (montant moins somme des ordres).
        orders:
          type: array
          description: Ordres d'achat.
          items:
            $ref: '#/components/schemas/PlanOrder'
    RebalancePlanRequest:
      type: object
      description: Demande de plan de rééquilibrage.
      required: [modelId, currency]
      properties:
        modelId:
          type: string
          format: uuid
          description: Modèle cible, dans sa dernière version.
          example: 5d7a2c64-9b1e-4f3a-8c2d-7e6f1a0b3c45
        accountIds:
          type: array
          description: Comptes à rééquilibrer. Si absent, tous les comptes.
          maxItems: 50
          items:
            type: string
            format: uuid
          example: [3f2a9c1e-7b4d-4e68-a1c5-2d9e8f7b6a40]
        contribution:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Nouvelle cotisation à investir, utilisée avant toute vente. Si absente, aucune.
        currency:
          $ref: '#/components/schemas/Currency'
        minOrderAmount:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Montant sous lequel un ordre est ignoré.
        bands:
          $ref: '#/components/schemas/Bands'
    ClassStatus:
      type: object
      description: Situation d'une classe d'actifs avant le plan.
      required: [assetClass, actual, target, outOfBand]
      properties:
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        actual:
          type: number
          format: double
          description: Poids réel, en fraction de la valeur de marché totale.
          example: 0.31
        target:
          type: number
          format: double
          description: Cible du modèle, en fraction.
          example: 0.275
        outOfBand:
          type: boolean
          description: Vrai si la classe est hors de sa bande (« à équilibrer »).
          example: true
    SkippedOrder:
      type: object
      description: Ordre écarté.
      required: [side, symbol, amount, reason]
      properties:
        side:
          $ref: '#/components/schemas/OrderSide'
        symbol:
          $ref: '#/components/schemas/Symbol'
        amount:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Montant de l'ordre écarté.
        reason:
          type: string
          description: Motif de l'écart.
          enum: [below_minimum, no_whole_share]
          example: below_minimum
    RebalancePlan:
      type: object
      description: Plan de rééquilibrage. Aucun ordre si tout est dans les bandes.
      required: [modelId, modelVersion, currency, classes, orders, skipped, cashAfter]
      properties:
        modelId:
          type: string
          format: uuid
          description: Modèle utilisé.
          example: 5d7a2c64-9b1e-4f3a-8c2d-7e6f1a0b3c45
        modelVersion:
          type: integer
          description: Version du modèle utilisée.
          example: 1
        currency:
          $ref: '#/components/schemas/Currency'
        totalValue:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Valeur de marché totale avant le plan. Absente si un prix manque.
        classes:
          type: array
          description: Situation de chaque classe avant le plan.
          items:
            $ref: '#/components/schemas/ClassStatus'
        orders:
          type: array
          description: Ordres, achats avant ventes.
          items:
            $ref: '#/components/schemas/PlanOrder'
        skipped:
          type: array
          description: Ordres écartés.
          items:
            $ref: '#/components/schemas/SkippedOrder'
        cashAfter:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Encaisse restante après exécution des ordres.
    ClassExposure:
      type: object
      description: Exposition à une classe d'actifs. Cible et écart sont absents sans modèle.
      required: [assetClass, actual]
      properties:
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        actual:
          type: number
          format: double
          description: Exposition réelle par transparence, en fraction.
          example: 0.31
        target:
          type: number
          format: double
          description: Cible du modèle, en fraction.
          example: 0.275
        deviation:
          type: number
          format: double
          description: Exposition réelle moins cible, en points de fraction.
          example: 0.035
    Exposure:
      type: object
      description: Exposition par transparence. Vide (aucune classe) si les comptes n'ont aucune position.
      required: [asOf, currency, classes]
      properties:
        asOf:
          type: string
          format: date
          description: Jour de valorisation.
          example: '2025-12-31'
        currency:
          $ref: '#/components/schemas/Currency'
        totalValue:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Valeur de marché des positions.
        weightedMer:
          type: number
          format: double
          description: RFG pondéré, en fraction. Absent si aucun fonds n'a de RFG.
          example: 0.0021
        modelId:
          type: string
          format: uuid
          description: Modèle de comparaison, s'il a été fourni.
          example: 5d7a2c64-9b1e-4f3a-8c2d-7e6f1a0b3c45
        classes:
          type: array
          description: Une entrée par classe d'actifs.
          items:
            $ref: '#/components/schemas/ClassExposure'
    PerformancePoint:
      type: object
      description: Rendement d'une période. Une mesure inconnue est absente.
      required: [period]
      properties:
        period:
          type: string
          description: Mois `AAAA-MM` ou année `AAAA`.
          pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
          example: 2025-03
        twr:
          type: number
          format: double
          description: Rendement pondéré dans le temps de la période, en fraction.
          example: 0.012
        irr:
          type: number
          format: double
          description: TRI de la période, en fraction (annualisé au-delà d'un an).
          example: 0.013
    PerformanceMethod:
      type: string
      description: |
        `transactions` : calcul sur le registre et les prix. `statements` : calcul sur les relevés de valeur mensuels
        ((valeur de fin − cotisation) / valeur de début − 1).
      enum: [transactions, statements]
      example: transactions
    PerformanceSeries:
      type: object
      description: Rendement d'un compte ou du consolidé.
      required: [monthly, annual]
      properties:
        accountId:
          type: string
          format: uuid
          description: Compte. Absent pour le consolidé.
          example: 3f2a9c1e-7b4d-4e68-a1c5-2d9e8f7b6a40
        method:
          $ref: '#/components/schemas/PerformanceMethod'
        twr:
          type: number
          format: double
          description: Rendement pondéré dans le temps sur toute la période, cumulé, en fraction.
          example: 0.082
        irr:
          type: number
          format: double
          description: TRI annualisé sur toute la période, en fraction.
          example: 0.079
        monthly:
          type: array
          description: Rendements mensuels.
          items:
            $ref: '#/components/schemas/PerformancePoint'
        annual:
          type: array
          description: Rendements annuels, calculés depuis la même série que les mois.
          items:
            $ref: '#/components/schemas/PerformancePoint'
    Performance:
      type: object
      description: Rendement pondéré dans le temps et TRI, consolidé et par compte.
      required: [from, to, consolidated, accounts]
      properties:
        from:
          type: string
          format: date
          description: Début de la période.
          example: '2025-01-01'
        to:
          type: string
          format: date
          description: Fin de la période.
          example: '2025-12-31'
        consolidated:
          $ref: '#/components/schemas/PerformanceSeries'
        accounts:
          type: array
          description: Rendement de chaque compte demandé.
          items:
            $ref: '#/components/schemas/PerformanceSeries'
