<mat-toolbar>
  <span class="titre">{{ 'app.titre' | t }}</span>
  <span class="espace"></span>
  @if (nom()) {
    <span class="utilisateur" data-testid="utilisateur">{{ 'auth.connecte' | t: { nom: nom() } }}</span>
  }
  <button mat-stroked-button type="button" data-testid="deconnexion" (click)="deconnexion()">
    {{ 'auth.deconnexion' | t }}
  </button>
</mat-toolbar>

<mat-sidenav-container class="conteneur">
  <mat-sidenav mode="side" opened role="navigation" [attr.aria-label]="'menu.navigation' | t">
    <mat-nav-list>
      <a mat-list-item routerLink="/stocks" routerLinkActive="actif" ariaCurrentWhenActive="page" data-testid="menu-stockeval">
        {{ 'menu.stockeval' | t }}
      </a>
      <a mat-list-item routerLink="/stocks/import" routerLinkActive="actif" ariaCurrentWhenActive="page" data-testid="menu-import">
        {{ 'menu.import' | t }}
      </a>
      <a mat-list-item routerLink="/comptes" routerLinkActive="actif" ariaCurrentWhenActive="page" data-testid="menu-comptes">
        {{ 'menu.comptes' | t }}
      </a>
      <a mat-list-item routerLink="/fnb" routerLinkActive="actif" ariaCurrentWhenActive="page" data-testid="menu-fnb">
        {{ 'menu.catalogue' | t }}
      </a>
      <a mat-list-item routerLink="/portefeuille" routerLinkActive="actif" ariaCurrentWhenActive="page" data-testid="menu-etf">
        {{ 'menu.etf' | t }}
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="contenu">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
